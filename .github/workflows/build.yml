name: Build DSHIOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # 获取完整历史，确保子模块状态正确

      - name: Clean Submodules
        run: |
          git submodule deinit -f .
          git clean -fdx
          git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          brew install meson ninja lld

      - name: Build Emulator and RootFS
        run: |
          make emulator
          make rootfs

      - name: Build Xcode Project
        run: |
          xcodebuild -project DSH.xcodeproj -scheme DSH -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/DSH.app Payload/
          zip -r DSHIOS-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHIOS-unsigned-ipa
          path: DSHIOS-unsigned.ipa
